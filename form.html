<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Form pendaftaran akun untuk membuat akun baru.">
<title>Form Pendaftaran Akun</title>
</head>
<body>

<header>
  <nav aria-label="Navigasi utama">
    <a href="index.html">IMDb Top 3</a> |
    <a href="blog.html">Dev Blogs</a> |
    <a href="form.html" aria-current="page">Form Pendaftaran</a> |
    <a href="cv.html">CV</a>
  </nav>
</header>
<hr>

<main>
<h1>Form Pendaftaran Akun</h1>

<form>
  <fieldset>
    <legend>Daftar Akun</legend>

    <p>
      <label for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" name="nama">
    </p>

    <fieldset>
      <legend>Jenis Kelamin</legend>
      <input type="radio" id="lk" name="jenis_kelamin" value="Laki-Laki">
      <label for="lk">Laki-Laki</label>
      <input type="radio" id="pr" name="jenis_kelamin" value="Perempuan">
      <label for="pr">Perempuan</label>
    </fieldset>

    <p>
      <label for="tempat_lahir">Tempat Lahir:</label>
      <input type="text" id="tempat_lahir" name="tempat_lahir">
    </p>

    <p>
      <label for="tanggal_lahir">Tanggal Lahir:</label>
      <input type="date" id="tanggal_lahir" name="tanggal_lahir">
    </p>

    <p>
      <label for="agama">Agama:</label>
      <select id="agama" name="agama">
        <option value="">--- Pilih Agama ---</option>
        <option value="Islam">Islam</option>
        <option value="Katolik">Katolik</option>
        <option value="Protestan">Protestan</option>
        <option value="Hindu">Hindu</option>
        <option value="Buddha">Buddha</option>
        <option value="Konghucu">Konghucu</option>
      </select>
    </p>

    <fieldset>
      <legend>Hobi</legend>
      <input type="checkbox" id="hobi_olahraga" name="hobi" value="Olahraga">
      <label for="hobi_olahraga">Olahraga</label>
      <input type="checkbox" id="hobi_membaca" name="hobi" value="Membaca">
      <label for="hobi_membaca">Membaca</label>
      <input type="checkbox" id="hobi_ngoding" name="hobi" value="Ngoding">
      <label for="hobi_ngoding">Ngoding</label>
    </fieldset>

    <p>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" autocomplete="new-password">
    </p>

    <p>
      <input type="checkbox" id="persetujuan" name="persetujuan">
      <label for="persetujuan">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
    </p>

    <p>
      <input type="reset" value="Reset">
      <input type="submit" value="Submit">
    </p>

  </fieldset>
</form>
</main>

</body>
</html>
